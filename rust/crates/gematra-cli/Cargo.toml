[package]
name = "gematra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native CLI for the gematrAI calculation engine (JSON in/out)"

[[bin]]
name = "gematra"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gematra-core = { path = "../gematra-core" }
gematra-ciphers = { path = "../gematra-ciphers" }
gematra-unicode = { path = "../gematra-unicode" }
gematra-fixtures = { path = "../gematra-fixtures" }
