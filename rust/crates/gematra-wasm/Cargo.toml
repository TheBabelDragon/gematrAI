[package]
name = "gematra-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the gematrAI calculation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gematra-core = { path = "../gematra-core" }
gematra-ciphers = { path = "../gematra-ciphers" }
gematra-unicode = { path = "../gematra-unicode" }
console_error_panic_hook = { workspace = true }

[dependencies.web-sys]
version = "=0.3.69"
features = []
