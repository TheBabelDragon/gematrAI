name: Rust engine

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "rust/**"
      - "js/**"
      - "app.js"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "js/**"
      - "app.js"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Build CLI
        working-directory: rust
        run: cargo build -p gematra-cli --release

      - name: Run fixture suite via CLI
        working-directory: rust
        run: ./target/release/gematra fixtures

      - name: Batch smoke (JSON array)
        working-directory: rust
        run: |
          echo '[{"id":"t1","text":"שלום","systems":["hebrew-standard"]},{"id":"t2","text":"herro prease","systems":["english-ordinal"]}]' \
            | ./target/release/gematra batch --totals-only \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result_count']==2; assert d['results'][0]['totals']['hebrew-standard']==376; assert d['results'][1]['totals']['english-ordinal']==128"

      - name: Reject invalid normalization
        working-directory: rust
        run: |
          if echo '[{"text":"a"}]' | ./target/release/gematra batch --norm nfkc --totals-only; then
            echo "expected nonzero exit for invalid --norm" >&2
            exit 1
          fi

      - name: Build WASM
        working-directory: rust
        run: cargo build -p gematra-wasm --release --target wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.92 --locked || cargo install wasm-bindgen-cli

      - name: Bindgen WASM artifacts
        working-directory: rust
        run: |
          mkdir -p ../wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/gematra_wasm.wasm \
            --out-dir ../wasm \
            --target web \
            --no-typescript
          ls -la ../wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gematra-wasm
          path: |
            wasm/gematra_wasm.js
            wasm/gematra_wasm_bg.wasm
          if-no-files-found: error
