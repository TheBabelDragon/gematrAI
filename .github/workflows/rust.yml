name: Rust engine

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "rust/**"
      - "js/**"
      - "app.js"
      - "scripts/corpus/**"
      - "data/seed/**"
      - "corpus/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "js/**"
      - "app.js"
      - "scripts/corpus/**"
      - "data/seed/**"
      - "corpus/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Build CLI
        working-directory: rust
        run: cargo build -p gematra-cli --release

      - name: Run fixture suite via CLI
        working-directory: rust
        run: ./target/release/gematra fixtures

      - name: Batch smoke (JSON array)
        working-directory: rust
        run: |
          python3 -c 'import json,sys; json.dump([{"id":"t1","text":"שלום","systems":["hebrew-standard"]},{"id":"t2","text":"herro prease","systems":["english-ordinal"]}], sys.stdout)' \
            | ./target/release/gematra batch --totals-only > /tmp/batch_out.json
          python3 -c "
          import json
          d=json.load(open('/tmp/batch_out.json'))
          assert d['result_count']==2, d
          assert d['results'][0]['totals']['hebrew-standard']==376, d
          assert d['results'][1]['totals']['english-ordinal']==128, d
          print('json array smoke ok')
          "

      - name: Batch smoke (NDJSON)
        working-directory: rust
        run: |
          python3 -c '
          import json,sys
          for row in [{"id":"1","text":"שלום","systems":["hebrew-standard"]},{"id":"2","text":"abc","systems":["english-ordinal"]}]:
              print(json.dumps(row, ensure_ascii=False))
          ' | ./target/release/gematra batch --totals-only > /tmp/ndjson_out.json
          python3 -c "
          import json
          d=json.load(open('/tmp/ndjson_out.json'))
          assert d['result_count']==2, d
          assert d['results'][0]['totals']['hebrew-standard']==376, d
          assert d['results'][1]['totals']['english-ordinal']==6, d
          print('ndjson smoke ok')
          "

      - name: Reject invalid normalization
        working-directory: rust
        run: |
          set +e
          python3 -c 'import json,sys; json.dump([{"text":"a"}], sys.stdout)' \
            | ./target/release/gematra batch --norm nfkc --totals-only > /tmp/bad_norm_out.txt 2>/tmp/bad_norm_err.txt
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "expected nonzero exit for invalid --norm" >&2
            exit 1
          fi
          if [ -s /tmp/bad_norm_out.txt ]; then
            echo "expected empty stdout on failure:" >&2
            cat /tmp/bad_norm_out.txt >&2
            exit 1
          fi
          grep -qi 'invalid normalization' /tmp/bad_norm_err.txt

      - name: Corpus build via Rust CLI
        run: |
          python3 scripts/corpus/build_with_rust.py \
            --gematra rust/target/release/gematra \
            --build-id "ci-${{ github.run_id }}"

      - name: Exact acceptance verification
        run: python3 scripts/corpus/verify_acceptance.py

      - name: Browser lookup simulation
        run: python3 scripts/corpus/test_browser_lookup.py

      - name: Artifact consistency
        run: |
          test -f corpus/generated/manifest.json
          test -f corpus/generated/values_low.json
          test -f corpus/generated/values_mid.json
          test -f corpus/generated/metadata/build.json
          python3 -c "
          import json
          m=json.load(open('corpus/generated/manifest.json'))
          st=m.get('stats') or {}
          assert st.get('unique_terms',0) >= 50, st
          assert st.get('seed_terms',0) >= 10, st
          assert m.get('engine_version')
          assert m.get('cipher_registry_version')
          assert m.get('unicode_policy_version')
          low=json.load(open('corpus/generated/values_low.json'))
          assert 'hebrew-standard' in low
          assert any(x.get('t')=='\u05d7\u05d9' for x in low['hebrew-standard'].get('18',[]))
          print('artifact consistency ok', st.get('unique_terms'))
          "

      - name: Build WASM
        working-directory: rust
        run: cargo build -p gematra-wasm --release --target wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.92 --locked || cargo install wasm-bindgen-cli

      - name: Bindgen WASM artifacts
        working-directory: rust
        run: |
          mkdir -p ../wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/gematra_wasm.wasm \
            --out-dir ../wasm \
            --target web \
            --no-typescript
          ls -la ../wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gematra-wasm
          path: |
            wasm/gematra_wasm.js
            wasm/gematra_wasm_bg.wasm
          if-no-files-found: error
