name: Corpus Tower
on:
  workflow_dispatch:
    inputs:
      torah_only:
        description: "Torah only (faster)"
        required: false
        default: "false"
  schedule:
    - cron: "0 6 * * 0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 scripts/tests/test_corpus.py -v
      - name: Build corpus from Sefaria export
        run: |
          if [ "${{ github.event.inputs.torah_only }}" = "true" ]; then
            python3 scripts/corpus/build_tower.py --torah-only
          else
            python3 scripts/corpus/build_tower.py
          fi
      - name: Verify
        run: |
          test -f corpus/generated/manifest.json
          test -f corpus/generated/metadata/build.json
          test -d corpus/generated/values/hebrew-standard
          python3 -c "import json; m=json.load(open('corpus/generated/metadata/build.json')); print(m['stats']); assert m['stats']['segments']>0"
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A corpus/generated
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "chore: rebuild corpus tower ($(date -u +%Y-%m-%d))"
            git push
          fi
