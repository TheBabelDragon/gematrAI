name: Corpus Tower

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope: torah | tanakh"
        required: true
        default: "torah"
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (fixtures only)
        run: python3 scripts/tests/test_corpus.py -v
      - name: Build corpus
        run: |
          SCOPE="${{ github.event.inputs.scope || 'torah' }}"
          python3 scripts/corpus/build_tower.py --scope "$SCOPE"
      - name: Verify artifacts
        run: |
          test -f corpus/generated/metadata/build.json
          test -f corpus/generated/corpus_client.json
          python3 -c "import json; m=json.load(open('corpus/generated/metadata/build.json')); print(m['stats']); assert m['stats']['unique_tokens']>0"
      - name: Commit generated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/generated
          if git diff --staged --quiet; then
            echo "No corpus changes"
          else
            git commit -m "chore: rebuild corpus tower ($(date -u +%Y-%m-%d))"
            git push
          fi
